  <meta name="keywords" content="Flutter developer, FinTech, BLoC, Riverpod, UPI, BBPS, NPCI, Firebase, mobile developer India, Chennai">

  <!-- Open Graph -->

  <meta property="og:description" content="4 years Flutter experience in FinTech. Built production payment apps with BLoC, NPCI, UPI, and BBPS.">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kalirajan K">

  <!-- Theme -->
  <meta name="theme-color" content="#0A0E1A">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Kalirajan K | Flutter Developer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      background-color: #0A0E1A;
      color: #E8EAF6;
      font-family: system-ui, sans-serif;
    }
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 20px;
    }
    #loading-title {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #02569B, #54C5F8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
    }
    #loading-bar-wrap {
      width: 160px;
      height: 3px;
      background: rgba(84, 197, 248, 0.15);
      border-radius: 2px;
      overflow: hidden;
    }
    #loading-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #02569B, #54C5F8);
      border-radius: 2px;
      animation: load 2s ease-in-out forwards;
    }
    @keyframes load {
      0%   { width: 0%; }
      60%  { width: 80%; }
      100% { width: 95%; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div id="loading-title">KK</div>
    <div id="loading-bar-wrap">
      <div id="loading-bar"></div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
